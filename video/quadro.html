<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Caveat"; src: url("assets/fonts/Caveat.ttf"); font-weight: 400 700; }
      :root { --tinta: #1b1f2a; --azul: #2a6fdb; --vermelho: #d6342b; --quadro: #faf8f2; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--quadro); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Caveat", cursive; color: var(--tinta); }
      #fundo { position: absolute; inset: 0; background-color: var(--quadro); background-image: var(--tex); background-size: 512px 512px; }
      #moldura { position: absolute; inset: 0; box-shadow: inset 0 0 160px rgba(120, 100, 60, 0.22); }
      .plano.clip { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: block; }
      .lousa { position: absolute; left: 0; top: 0; overflow: visible; }
      .txt { position: absolute; transform: translate(-50%, -50%); font-weight: 700; line-height: 1.02; text-align: center; white-space: nowrap; opacity: 0; }
      .txt span { opacity: 0; }
      .limpa { position: absolute; inset: 0; background-color: var(--quadro); background-image: var(--tex); background-size: 512px 512px; clip-path: inset(0 100% 0 0); }
      .apagador { position: absolute; left: -260px; top: 560px; width: 230px; height: 640px; border-radius: 28px; background: #3a4a63;
                  box-shadow: 0 12px 30px rgba(0,0,0,0.35), inset 0 -40px 0 #1e2a3c; }
      /* legenda: letra manuscrita embaixo do quadro */
      .clip { position: absolute; left: 70px; right: 70px; bottom: 210px; display: flex; align-items: center; justify-content: center; z-index: 50; }
      .fala { font-family: "Caveat", cursive; font-weight: 700; font-size: 124px; line-height: 1.05; color: var(--tinta); text-align: center; }
      .fala span { display: inline-block; margin: 0 0.1em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURACAO__" data-width="1080" data-height="1920">
      <audio id="narracao" src="narration.wav" data-start="0" data-duration="__DURACAO__" data-track-index="2"></audio>
      <div id="fundo" data-start="0" data-duration="__DURACAO__" data-track-index="0"></div>
      <div id="moldura" data-start="0" data-duration="__DURACAO__" data-track-index="0"></div>
__PLANOS__
__GRUPOS__
    </div>
    <script>
      const DADOS = __DADOS__;

      // textura leve de quadro (determinística)
      (function () {
        const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
        g.fillStyle = '#faf8f2'; g.fillRect(0, 0, 512, 512);
        let s = 7; const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
        const img = g.getImageData(0, 0, 512, 512); const d = img.data;
        for (let i = 0; i < d.length; i += 4) { const v = (r() - 0.5) * 7; d[i] += v; d[i + 1] += v; d[i + 2] += v; }
        g.putImageData(img, 0, 0);
        g.strokeStyle = 'rgba(150,140,120,0.07)'; g.lineWidth = 2;
        for (let i = 0; i < 40; i++) { const x = r() * 512, y = r() * 512; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 40 + r() * 80, y + (r() - 0.5) * 8); g.stroke(); }
        document.documentElement.style.setProperty('--tex', 'url(' + c.toDataURL('image/png') + ')');
      })();

      const tl = gsap.timeline({ paused: true });
      function traco(sel, t, dur) {
        tl.set(sel, { opacity: 1, strokeDashoffset: 1 }, t);
        tl.to(sel, { strokeDashoffset: 0, duration: dur, ease: 'none' }, t);
      }
      function escreve(sel, n, t, passo) {
        for (let i = 0; i < n; i++) tl.set(sel + 'c' + i, { opacity: 1 }, t + i * passo);
      }
      function apaga(limpa, apagador, t) {
        tl.to(limpa, { clipPath: 'inset(0 0% 0 0)', duration: 0.4, ease: 'power1.inOut' }, t);
        tl.fromTo(apagador, { x: 0 }, { x: 1400, duration: 0.4, ease: 'power1.inOut' }, t);
      }

__ANIM_PLANOS__
__ANIMACOES__
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
