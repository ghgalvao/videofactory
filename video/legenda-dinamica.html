<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root { --fundo: #0b0d12; --texto: #f4f1ea; --g: #e8c46a; --serifa: Impact, "Arial Narrow", sans-serif; --sans: "Segoe UI", Arial, sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--fundo); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--fundo); font-family: var(--serifa); }
      #glow { position: absolute; left: -380px; top: 300px; width: 1840px; height: 1320px; border-radius: 50%;
              background: radial-gradient(circle, var(--g) 0%, rgba(0,0,0,0) 60%); opacity: 0.16; }
      #grao { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%); }
      .linha { position: absolute; left: 90px; right: 90px; height: 2px; background: rgba(244,241,234,0.22); transform-origin: left center; }
      #prog { position: absolute; left: 90px; bottom: 150px; height: 4px; width: 900px; background: var(--g); transform-origin: left center; }
      .clip.num { left: 0; right: 0; top: 380px; bottom: auto; display: block; text-align: center; font-size: 1150px; line-height: 1; color: var(--g);
             opacity: 0.06; }
      .clip.selo { left: 0; right: 0; top: 250px; bottom: auto; display: block; text-align: center; color: var(--g); }
      .selo b { display: block; font-family: var(--sans); font-weight: 600; font-size: 40px; letter-spacing: 18px; text-indent: 18px; }
      .selo i { display: block; margin: 22px auto 0; width: 220px; height: 3px; background: currentColor; transform-origin: center; }
      .clip { position: absolute; left: 80px; right: 80px; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
      .fala { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 0 38px;
              font-size: 150px; line-height: 1.08; font-weight: 400; color: var(--texto); text-align: center; letter-spacing: 3px; text-transform: uppercase; }
      .fala span { display: inline-block; opacity: 0; }
      .fala span.forte { font-size: 215px; letter-spacing: 4px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURACAO__" data-width="1080" data-height="1920">
      <div id="glow"></div>
      <div id="grao"></div>
      <div class="linha" style="top:170px" id="l1"></div>
      <div class="linha" style="top:1750px" id="l2"></div>
      <audio id="narracao" src="narration.wav" data-start="0" data-duration="__DURACAO__" data-track-index="2"></audio>
__SELOS__
__GRUPOS__
      <div id="prog"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const D = __DURACAO__;
      tl.fromTo("#prog", { scaleX: 0 }, { scaleX: 1, duration: D, ease: "none" }, 0);
      tl.fromTo("#l1", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.out" }, 0);
      tl.fromTo("#l2", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.out" }, 0.15);
      tl.fromTo("#glow", { scale: 0.92 }, { scale: 1.12, duration: D, ease: "none" }, 0);
__ANIMACOES__
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
