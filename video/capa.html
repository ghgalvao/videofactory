<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vendor/three-premium.min.js"></script>
    <style>
      @font-face { font-family: "Plex Mono"; src: url("assets/fonts/IBMPlexMono-Medium.ttf"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #06080b; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #fff; font-family: "Segoe UI Black", "Arial Black", sans-serif; }
      #fundo { position: absolute; inset: 0; background:
        radial-gradient(700px 600px at 50% 40%, __BRILHO__, transparent 65%),
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px) 0 0 / 54px 54px,
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px) 0 0 / 54px 54px, #06080b; }
      #vinheta { position: absolute; inset: 0; box-shadow: inset 0 0 300px rgba(0,0,0,0.9); }
      canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      /* tudo que importa fica na faixa 3:4 do grid (y 240–1680) */
      #serie { position: absolute; left: 0; right: 0; top: 285px; text-align: center; font-family: "Plex Mono"; font-size: 40px; letter-spacing: 6px; color: #b7c2cf; }
      #serie b { color: #3ddc84; font-weight: 500; }
      #selo { position: absolute; left: 50%; top: 425px; transform: translate(-50%, -50%) rotate(-3deg); padding: 16px 44px; border-radius: 60px; background: #3ddc84; color: #04140b;
              font-size: 64px; letter-spacing: 2px; white-space: nowrap; box-shadow: 0 0 60px rgba(61,220,132,0.55), 0 12px 0 #1d8a4e; }
      #num { position: absolute; left: 70px; top: 470px; font-size: 300px; line-height: 1; color: transparent; -webkit-text-stroke: 6px rgba(255,255,255,0.22); letter-spacing: -8px; }
      #chips { position: absolute; left: 0; right: 0; top: 1015px; display: flex; justify-content: center; align-items: center; gap: 22px; }
      .chip { padding: 16px 28px; border-radius: 22px; background: #0e131a; border: 4px solid; font-size: 54px; letter-spacing: -1px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
      #chips i { font-style: normal; font-size: 90px; color: #fff; }
      #titulo { position: absolute; left: 50px; right: 50px; top: 1180px; text-align: center; line-height: 0.98; text-shadow: 0 10px 40px rgba(0,0,0,0.9); }
      #titulo .l1 { display: block; font-size: 112px; letter-spacing: -1px; }
      #titulo .l2 { display: block; font-size: 158px; letter-spacing: -2px; color: __COR__; }
      #rodape { position: absolute; left: 0; right: 0; top: 1745px; text-align: center; font-family: "Segoe UI"; font-weight: 700; font-size: 38px; color: #8592a3; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <div id="fundo"></div>
      <div id="num">__NUM__</div>
      <canvas id="c3d"></canvas>
      <div id="vinheta"></div>
      <div id="serie">__SERIE__</div>
      __SELO__
      <div id="chips">__CHIPS__</div>
      <div id="titulo"><span class="l1">__L1__</span><span class="l2">__L2__</span></div>
      <div id="rodape">toque para assistir ▶</div>
    </div>
    <script>
      const T = THREE, PI = Math.PI, W = 1080, H = 1920;
      const r = new T.WebGLRenderer({ canvas: document.getElementById('c3d'), antialias: true, alpha: true, preserveDrawingBuffer: true });
      r.setPixelRatio(1); r.setSize(W, H, false); r.setClearColor(0, 0); r.toneMapping = T.ACESFilmicToneMapping; r.outputColorSpace = T.SRGBColorSpace;
      const scene = new T.Scene(); scene.environment = new T.PMREMGenerator(r).fromScene(new T.RoomEnvironment(), 0.04).texture;
      const cam = new T.OrthographicCamera(0, W, 0, -H, -3000, 3000);
      const sol = new T.DirectionalLight('#fff4dc', 3.4); sol.position.set(300, 500, 900); scene.add(sol);
      const frente = new T.DirectionalLight('#ffffff', 1.6); frente.position.set(0, 0, 1000); scene.add(frente); scene.environmentIntensity = 1.4;
      const mk = () => {
        const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d'); g.translate(512, 0); g.scale(-1, 1);
        const gr = g.createRadialGradient(200, 180, 30, 256, 256, 260); gr.addColorStop(0, '#ffe08a'); gr.addColorStop(0.6, '#f7b733'); gr.addColorStop(1, '#b97a12');
        g.fillStyle = gr; g.fillRect(0, 0, 512, 512); g.strokeStyle = 'rgba(120,70,0,0.55)'; g.lineWidth = 16; g.beginPath(); g.arc(256, 256, 214, 0, 2 * PI); g.stroke();
        const B = (dx, dy, cor) => { g.fillStyle = cor; g.font = '900 290px "Segoe UI Black", Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('B', 256 + dx, 262 + dy);
          [[214, 122], [272, 122]].forEach(([x, y0]) => { g.fillRect(x + dx, y0 + dy - 40, 26, 54); g.fillRect(x + dx, y0 + dy + 258, 26, 54); }); };
        B(8, 8, '#8a5a08'); B(0, 0, '#fff3c4');
        const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; t.center.set(0.5, 0.5); t.rotation = -PI / 2; return t;
      };
      const fm = new T.MeshPhysicalMaterial({ map: mk(), metalness: 0.85, roughness: 0.3, clearcoat: 0.7 });
      const lado = new T.MeshPhysicalMaterial({ color: '#f2a91e', metalness: 1, roughness: 0.28, clearcoat: 0.6 });
      const MOEDAS = __MOEDAS__;
      MOEDAS.forEach(([x, y, raio, ry, rx]) => {
        const g = new T.Group(); const m = new T.Mesh(new T.CylinderGeometry(1, 1, 0.16, 96), [lado, fm, fm]); m.rotation.x = PI / 2; g.add(m);
        g.position.set(x, -y, 0); g.scale.setScalar(raio); g.rotation.set(rx, ry, 0); scene.add(g);
      });
      r.render(scene, cam);
      const tl = gsap.timeline({ paused: true }); tl.to({}, { duration: 1 });
      window.__timelines = { main: tl };
    </script>
  </body>
</html>
