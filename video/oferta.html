        -webkit-background-clip: text; background-clip: text; color: transparent; }
      .t3d.branco .tf { background: linear-gradient(180deg, #ffffff 0%, #ffffff 55%, #d8dde6 100%); -webkit-background-clip: text; background-clip: text; }

        font: 900 64px "Segoe UI Black", Arial Black; color: #fff; letter-spacing: 0.06em; text-shadow: 0 5px 0 #4a2408; box-shadow: 0 16px 30px rgba(0,0,0,0.45); }
      .pilula { padding: 12px 40px; border-radius: 999px; border: 4px dashed rgba(255,255,255,0.9); font: 900 40px "Segoe UI Black", Arial Black;

      .pilula img { display: block; max-height: 90px; }
      .etiq { padding: 12px 34px; border-radius: 16px; background: var(--ouro1, #ffd23f); color: var(--fundo0, #5c0006);
        font: 900 48px "Segoe UI Black", Arial Black; white-space: nowrap; box-shadow: 0 10px 0 rgba(0,0,0,0.25); }
      .preco { background: var(--ouro1, #ffd23f); border: 10px solid #fff; border-radius: 34px; padding: 6px 40px 14px; color: var(--fundo1, #b3000c);
        text-align: center; white-space: nowrap; box-shadow: 0 22px 40px rgba(0,0,0,0.45); font-family: "Segoe UI Black", Arial Black; }
      .preco .pre { font-size: 46px; font-weight: 900; color: var(--fundo0, #5c0006); letter-spacing: 0.04em; }
      .preco .v { font-size: 170px; line-height: 0.95; }

      .zap { display: flex; align-items: center; gap: 22px; background: #1fae54; border: 5px solid #fff; border-radius: 999px; padding: 16px 44px 16px 18px;

      .zap .ic { width: 84px; height: 84px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; }
      .aviso { font: 600 28px "Segoe UI", Arial; color: rgba(255,255,255,0.85); white-space: nowrap; text-align: center; letter-spacing: 0.02em; }
      .bonecos { display: flex; gap: 20px; }
      .gr .lin { position: absolute; left: 0; right: 0; }
      .gr .nm { height: 46px; font: 600 34px "Segoe UI", Arial; color: #e8eaed; letter-spacing: 0.02em; opacity: 0; }
      .gr .trk { height: 60px; display: flex; align-items: center; background: rgba(255,255,255,0.07); border-radius: 8px; overflow: visible; }
      .gr .bar { height: 100%; width: 0; flex: 0 0 auto; border-right: 3px solid #0f1218; }
      .gr .bar:first-child { border-radius: 8px 0 0 8px; }
      .gr .vl { margin-left: 16px; font: 800 38px "Segoe UI Black", Arial Black; color: #fff; white-space: nowrap; opacity: 0; }

      .tela .vp { position: relative; overflow: hidden; }

      .tela .barra i { width: 14px; height: 14px; border-radius: 50%; background: #5b6370; display: block; }
      .anel { position: absolute; border: 6px solid var(--verde); border-radius: 14px; box-shadow: 0 0 24px var(--verde); }

  <body>

    <script>
      const DADOS = __DADOS__;
      const S = DADOS.shots, FR = DADOS.frases;
      document.querySelectorAll('.el').forEach((e) => gsap.set(e, { xPercent: -50, yPercent: -50, rotation: parseFloat(e.dataset.rot || '0') }));
      const tl = gsap.timeline({ paused: true });
      const brl = (v, dec) => v.toFixed(dec || 0).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      function ent(sel, tipo, t) {
        if (tipo === 'baixo') tl.from(sel, { y: '+=140', opacity: 0, duration: 0.55, ease: 'power3.out' }, t);
        else if (tipo === 'cima') tl.from(sel, { y: '-=140', opacity: 0, duration: 0.55, ease: 'power3.out' }, t);
        else if (tipo === 'fade') tl.from(sel, { opacity: 0, duration: 0.5 }, t);
        else if (tipo === 'bate') tl.from(sel, { scale: 2.2, opacity: 0, duration: 0.3, ease: 'back.out(2)' }, t);
        else if (tipo === 'abre') tl.from(sel, { opacity: 0, letterSpacing: '0.9em', duration: 0.9, ease: 'power2.out' }, t);
        else if (tipo === 'blur') tl.from(sel, { scale: 1.6, opacity: 0, filter: 'blur(22px)', duration: 0.75, ease: 'back.out(1.5)' }, t);
        else if (tipo === 'esq') tl.from(sel, { x: '-=700', opacity: 0, duration: 0.5, ease: 'power3.out' }, t);
        else if (tipo === 'dir') tl.from(sel, { x: '+=700', opacity: 0, duration: 0.5, ease: 'power3.out' }, t);
        else tl.from(sel, { scale: 0.7, opacity: 0, duration: 0.4, ease: 'back.out(1.8)' }, t);
      }
      function contar(sel, de, ate, dec, pre, t, dur, suf) {
        suf = suf || '';
        const el = document.querySelector(sel); const o = { v: de }; el.textContent = pre + brl(de, dec) + suf;
        tl.to(o, { v: ate, duration: dur, ease: 'power2.inOut', onUpdate: () => { el.textContent = pre + brl(o.v, dec) + suf; } }, t);
      }
      function barra(sel, pct, t) { tl.fromTo(sel, { width: '0%' }, { width: pct + '%', duration: 0.9, ease: 'power3.out' }, t); }
      function some(sel, t, passo) { document.querySelectorAll(sel + ' .moeda').forEach((m, i) => { tl.to(m, { scale: 0, opacity: 0, duration: 0.22, ease: 'back.in(2)' }, t + i * passo); }); }
      function linha(sel, t) { tl.from(sel + ' line', { attr: { x2: function (i, el) { return el.getAttribute('x1'); }, y2: function (i, el) { return el.getAttribute('y1'); } }, duration: 0.4, ease: 'power2.out' }, t); tl.from(sel + ' .callout', { opacity: 0, duration: 0.3 }, t + 0.25); }
      function mostra(sel, t) { tl.from(sel, { opacity: 0, y: 24, duration: 0.35, ease: 'power2.out' }, t); }

      tl.fromTo('#raios', { rotation: 0 }, { rotation: 50, duration: __DURACAO_NUM__, ease: 'none' }, 0);
      tl.fromTo('#brilho', { scale: 0.9, opacity: 0.7 }, { scale: 1.15, opacity: 1, duration: 1.2, yoyo: true, repeat: Math.max(1, Math.floor(__DURACAO_NUM__ / 1.2)), ease: 'sine.inOut' }, 0);
      window.__timelines = window.__timelines || {};

      tl.seek(0);
