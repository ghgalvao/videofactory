<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --fundo: #0e1116;
        --texto: #ffffff;
        --destaque: #ffd23f;
        --fonte: "Arial Black", Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--fundo); }
      #root { position: relative; width: 1080px; height: 1920px; background: var(--fundo); font-family: var(--fonte); }
      .clip { position: absolute; left: 70px; right: 70px; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
      .fala { font-size: 96px; line-height: 1.2; color: var(--texto); text-align: center; }
      .fala span { display: inline-block; margin: 0 0.1em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURACAO__" data-width="1080" data-height="1920">
      <audio id="narracao" src="narration.wav" data-start="0" data-duration="__DURACAO__" data-track-index="2"></audio>
__GRUPOS__
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
__ANIMACOES__
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
