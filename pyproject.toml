[project]
name = "videofactory"
version = "0.1.0"
description = "Fábrica de vídeos curtos verticais, CPU only"
requires-python = ">=3.11,<3.13"
dependencies = [
    "edge-tts>=7.3.1",
    "faster-whisper>=1.2.1",
    "kokoro>=0.9.4",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pyspellchecker>=0.9.1",
    "soundfile>=0.14.0",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
vf = "vf.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vf"]
